[system]
host = 127.0.0.1
port = 5000
debug = false
secret_key = ids-sec-key-local-development-only

[capture]
default_interface = en0 
bpf_filter = 
promiscuous = true
packet_buffer_size = 10000
max_packet_rate = 1000

[flow]
idle_timeout_sec = 15.0
active_timeout_sec = 60.0
flow_cleanup_interval_sec = 10.0

[detection]
syn_flood_threshold = 50
syn_flood_ack_ratio = 0.1
port_scan_threshold = 15
port_scan_window_sec = 5.0
vertical_scan_ports = 21,22,23,25,53,80,110,135,139,143,443,445,1433,3306,3389,8080
udp_flood_threshold = 100
icmp_flood_threshold = 40
packet_rate_spike_threshold = 200
anomaly_score_threshold = -0.45
min_ml_confidence = 0.85

[prevention]
# Modes: 1 = Detection Only, 2 = Assisted Prevention, 3 = Automatic Prevention
prevention_mode = 3
default_block_duration_sec = 300
max_block_duration_sec = 86400
rate_limit_blocks_per_min = 60
auto_block_severities = CRITICAL,HIGH

[protected_addresses]
# Addresses that can never be blocked by the firewall
static_protected = 127.0.0.1,::1,0.0.0.0,255.255.255.255
protect_default_gateway = true
protect_local_interfaces = true
protect_dns_servers = true
user_allowlist = 

[ai]
# Cloud AI Provider: gemini or local_fallback
provider = gemini
gemini_model = gemini-2.5-flash
# Set via GEMINI_API_KEY environment variable or optionally specify below
gemini_api_key = 
sanitize_payloads = true

[database]
db_path = ids_events.db
retention_days = 7
max_stored_packets = 50000
max_stored_flows = 20000
max_stored_alerts = 10000
